[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrep-bridge"
version = "1.0.0"
description = "SmartRep student prototype bridge"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6", "uvicorn==0.34.0", "pydantic==2.10.4",
  "qrcode[pil]==8.0", "websockets==15.0.1",
  "pyserial==3.5", "zeroconf==0.144.3", "reportlab==4.4.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.setuptools.package-data]
smartrep = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["smartrep*"]
